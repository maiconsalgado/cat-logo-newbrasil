<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamentos · Catálogo de produtos</title>
<style>
:root{--bg:#f4f5f7;--fg:#1b1f24;--mut:#667085;--card:#fff;--bd:#e3e6ea;--acc:#0f766e;--accfg:#fff;--ok:#15803d;--no:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--fg:#e8eaed;--mut:#9aa3ae;--card:#1a1f26;--bd:#2c333c;--acc:#2dd4bf;--accfg:#06201c;--ok:#4ade80;--no:#f87171}}
:root[data-theme="dark"]{--bg:#111418;--fg:#e8eaed;--mut:#9aa3ae;--card:#1a1f26;--bd:#2c333c;--acc:#2dd4bf;--accfg:#06201c;--ok:#4ade80;--no:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 14px}
header img{height:46px;width:46px;max-width:40%;object-fit:contain}
header h1{font-size:15px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px}
.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
#badge{background:var(--accfg);color:var(--acc);border-radius:99px;padding:0 7px;margin-left:6px;font-size:13px}
.bar{max-width:1200px;margin:0 auto;padding:12px 14px 0}
.sr{display:flex;gap:8px}.sr button{font-size:22px;padding:0 14px;border-radius:12px}#sc{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:60;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}#sc.on{display:flex}#scv{width:100%;max-width:520px;max-height:55vh;border-radius:14px;background:#000;object-fit:cover}#scm{color:#fff;text-align:center;font-size:15px}#scm.err{color:#ffb4b4}#sc .row2{display:flex;gap:8px}#sc .up,#sc .row2 button{background:#fff;color:#000;border:0;padding:12px 16px;border-radius:10px;font-size:15px}.bar input[type=search]{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg)}
.flt{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:10px 2px;color:var(--mut);font-size:14px}
.flt label{display:flex;gap:6px;align-items:center}
main{max-width:1200px;margin:0 auto;padding:0 14px 40px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.ph,.th{background:#fff;border-radius:10px;object-fit:contain;flex:none}
.ph{width:92px;height:92px}.th{width:48px;height:48px}
.noimg{display:flex;align-items:center;justify-content:center;font-size:11px;color:#98a2b3;background:#f2f4f7;text-align:center}
.bd,.ib{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cd{font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}
.ok{color:var(--ok)}.no{color:var(--no)}
h3{font-size:14px;margin:0;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:18px;font-weight:700;margin-top:auto}
.add{background:var(--acc);color:var(--accfg);border-color:var(--acc);padding:7px 10px;font-size:14px}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:34px;padding:6px 0}
.step input{width:56px;text-align:center;padding:7px 4px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
#more{display:block;margin:18px auto}
.empty{text-align:center;color:var(--mut);padding:40px 0;grid-column:1/-1}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
#panel{position:fixed;top:0;bottom:0;right:0;width:min(480px,100%);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.open #panel{transform:none}body.open #shade{display:block}
#panel>header{position:static}
.pbody{flex:1;overflow:auto;padding:12px 14px}
.fld{display:grid;gap:8px;margin-bottom:12px}.fld .fchk{display:flex;gap:8px;align-items:center;font-size:15px;padding:4px 2px}.fld .fchk input{width:20px;height:20px;padding:0}
.fld input,.fld textarea,.dsc input,.dsc select{width:100%;padding:10px 12px;font:inherit;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}
li small{color:var(--mut)}li b{font-size:13px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.row strong{margin-left:auto}
.x{border:none;background:none;color:var(--no);padding:4px 6px}
.dsc{display:grid;grid-template-columns:1fr 90px 1fr;gap:8px;align-items:center;margin:12px 0}
.tot{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.tot div{display:flex;justify-content:space-between}
.tot .g{font-size:20px;font-weight:700;border-top:1px solid var(--bd);padding-top:6px;margin-top:4px}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;border-top:1px solid var(--bd);background:var(--card)}
.act .pri{grid-column:1/-1;padding:12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#101828;color:#fff;padding:10px 16px;border-radius:99px;z-index:30;display:none}
#sheet{display:none}
@media print{body>*{display:none!important}body>#sheet{display:block!important;color:#000;background:#fff;padding:0}body::before{display:none}
#sheet table{width:100%;border-collapse:collapse;font-size:12px}#sheet td,#sheet th{border-bottom:1px solid #ccc;padding:5px;text-align:left}#sheet img{width:36px;height:36px;object-fit:contain}
#sheet .t{text-align:right}}
#fm{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
#fm.on{display:flex}
#ff{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:min(420px,100%);max-height:100%;overflow:auto;display:grid;gap:10px}
#ff h2{margin:0;font-size:17px}
#ff input:not([type=checkbox]){width:100%;padding:10px 12px;font:inherit;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg)}
.ck,.fp,.fa{display:flex;gap:10px;align-items:center}
.up{cursor:pointer;border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
.fa{justify-content:flex-end}
[hidden]{display:none!important}
.r{display:flex;gap:8px;align-items:center}
.ibr{display:flex;gap:8px;margin-bottom:10px}.ibr button{flex:1;padding:11px}
#im{position:fixed;inset:0;z-index:26;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
#im.on{display:flex}
#imp{background:var(--bg);border:1px solid var(--bd);border-radius:14px;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.ih{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.ih h2{margin:0;font-size:17px}
.imb{padding:14px;overflow:auto;display:grid;gap:12px;align-content:start}
#imp>.imb{flex:1;min-height:0}
.pane{display:flex;flex-direction:column;flex:1;min-height:0}
.pane .imb{flex:1;min-height:0}
.imb0{display:grid;gap:10px}
.imb h4{margin:4px 0;font-size:14px}
.mut{color:var(--mut);font-size:14px;margin:0}
#imt{width:100%;padding:10px 12px;font:inherit;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
#imth{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#imth img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
#ims{margin:0;font-size:14px;color:var(--mut)}#ims.err{color:var(--no)}
.kit{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.kit span{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.irs{display:grid;gap:8px}
.ir{display:grid;grid-template-columns:auto 1fr 84px;gap:10px;align-items:start;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.ick{width:20px;height:20px;margin-top:4px}
.ib2{display:grid;gap:6px;min-width:0}
.ot{font-size:14px;font-weight:600}.ot small{font-weight:400;color:var(--mut)}
.isel,.ibus,.iqt,#imkn{width:100%;padding:8px 10px;font:inherit;font-size:15px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);min-width:0}
.iq{display:grid;gap:4px;text-align:right}.ipr{font-weight:700;font-size:14px}
.imf{display:grid;gap:8px;padding:12px 14px;border-top:1px solid var(--bd);background:var(--card)}
.imf .r input{flex:1}
.ibr{display:none!important}
</style>
</head>
<body>
<header>
<img id="logo" alt="" hidden><h1 id="co"></h1>
<button id="newp" hidden>+ Cadastrar</button><button class="pri" id="open">Orçamento<span id="badge">0</span></button>
</header>
<div class="bar">
<div class="ibr"><button class="pri" id="impb" hidden>Importar lista escolar</button><button class="pri" id="ipob">Importar orçamento</button><input type="file" id="ipf" accept="application/pdf,.pdf" hidden></div>
<div class="sr"><input type="search" id="q" placeholder="Buscar por código, descrição ou código de barras" autocomplete="off"><button id="scb" aria-label="Ler código de barras pela câmera">📷</button></div>
<div class="flt"><label><input type="checkbox" id="fp"> Só com foto</label><label><input type="checkbox" id="fs"> Só em estoque</label><span id="cnt"></span></div>
</div>
<main><div id="grid"></div><button id="more" hidden>Mostrar mais</button></main>
<div id="shade"></div>
<aside id="panel" aria-label="Orçamento">
<header><h1>Meu orçamento</h1><button id="close">Fechar</button></header>
<div class="pbody">
<div class="fld"><input id="cn" placeholder="Nome do cliente"><input id="cp" inputmode="tel" placeholder="WhatsApp do cliente (com DDD)"><input id="cpay" placeholder="Formas de pagamento"><input id="cprz" placeholder="Prazo de entrega"><textarea id="cnq" rows="2" placeholder="Itens não cotados"></textarea><textarea id="cnt" rows="2" placeholder="Produtos que não trabalhamos"></textarea><label class="fchk"><input type="checkbox" id="cful"> Lista completa (nenhum item faltou cotar)</label><textarea id="co2" rows="2" placeholder="Outras observações (validade…)"></textarea></div>
<ul id="items"></ul>
<div class="dsc"><span>Desconto</span><select id="dt"><option value="pct">%</option><option value="brl">R$</option></select><input id="dv" type="number" min="0" step="0.01" inputmode="decimal"></div>
<div class="tot" id="tot"></div>
</div>
<div class="act"><button class="pri" id="wa">Enviar por WhatsApp</button><button id="pdf">Baixar PDF</button><button id="cp2">Copiar texto</button><button id="clr" style="grid-column:1/-1">Limpar orçamento</button></div>
</aside>
<div id="fm"><div id="ff"><h2 id="ft">Cadastrar produto</h2>
<input id="fc" placeholder="Código do produto *" autocomplete="off"><input id="fd" placeholder="Descrição *" autocomplete="off">
<input id="fv" inputmode="decimal" placeholder="Preço, ex.: 9,90 *"><input id="fb" inputmode="numeric" placeholder="Código de barras (opcional)">
<label class="ck"><input type="checkbox" id="fe" checked> Em estoque</label>
<div class="fp"><div id="fprev" class="noimg" style="width:64px;height:64px;border-radius:10px"></div><label class="up">Escolher foto<input type="file" id="ffile" accept="image/*" hidden></label></div>
<div class="fa"><button class="x" id="fdel" hidden>Excluir</button><button id="fcl">Cancelar</button><button class="pri" id="fsv">Salvar</button></div></div></div>
<div id="im"><div id="imp" role="dialog" aria-label="Importar lista escolar">
<div class="ih"><h2>Importar lista escolar</h2><button id="imx">Fechar</button></div>
<div id="im1" class="imb">
<div id="kitbox"></div>
<div id="imread" class="imb0">
<h4>Ler uma lista nova</h4>
<p class="mut">Anexe a foto ou o print da lista (pode ser mais de uma página) ou cole o texto. Se a lista for um PDF, tire um print ou cole o texto.</p>
<label class="up">Anexar foto, print ou PDF<input type="file" id="imf" accept="image/*,application/pdf,.pdf" multiple hidden></label>
<div id="imth"></div>
<textarea id="imt" rows="5" placeholder="Ou cole aqui o texto da lista"></textarea>
<div class="r"><button class="pri" id="imgo">Ler lista</button><button id="imcancel" hidden>Cancelar</button></div>
<p id="ims"></p>
</div></div>
<div id="im2" class="pane" hidden>
<div class="imb"><div id="imh"></div><div id="imr" class="irs"></div></div>
<div class="imf"><div id="imkw" class="r" hidden><input id="imkn" placeholder="Nome do kit (ex.: CEC · 4º ano)"><button id="imk">Salvar como kit</button></div>
<div class="r"><button id="imb">Voltar</button><strong id="imtot" style="flex:1;text-align:right"></strong><button class="pri" id="ima">Adicionar ao orçamento</button></div></div>
</div></div></div>
<div id="sc"><video id="scv" muted playsinline></video><div id="scm"></div><div class="row2"><label class="up">Tirar foto do código<input type="file" id="scf" accept="image/*" capture="environment" hidden></label><button id="scx">Fechar</button></div></div>
<section id="sheet"></section>
<div id="toast"></div>
<script>

const STOPW=new Set(["de","da","do","das","dos","com","c","para","p","e","a","o","as","os","em","um","uma","por","no","na","ou"]);
const SYN={glitter:"gliter",glit:"gliter",eva:"emborrachado",esferografica:"caneta",hidrografica:"hidrocor",atomico:"marcador",tintas:"tinta"};
const EQ=[[/\bfolhas?\b|\bfls\b|\bfl\b/g,"fl"],[/\bespiral\b|\besp\b/g,"esp"],[/\belastic[oa]?\b/g,"elastico"],[/\bquadro\b|\bqdo\b/g,"qdo"],[/\bclassificador(es)?\b/g,"pasta elastico"],[/\btransparente\b|\bincolor\b/g,"cristal"],[/\bsem ponta\b/g,"escolar"],[/\btinta guache\b/g,"guache"],[/\bunidades?\b|\bund\b|\bun\b/g," "]];

const words=i=>{const r=DATA[i],k=r[0];let w=wc.get(k);if(w===undefined||w[0]!==r[1]){w=[r[1]," "+nz(r[0]+" "+r[1]+" "+r[5]).replace(/[^a-z0-9+]+/g," ")+" "];wc.set(k,w)}return w[1]};
const stem=t=>t.length>3&&t.endsWith("s")&&!t.endsWith("ss")?t.slice(0,-1):t;
const toks=s=>nz(s).split(/[^a-z0-9+]+/).filter(t=>t&&!STOPW.has(t)).map(t=>SYN[t]||stem(t));
const df=t=>{let v=dfc.get(t);if(v===undefined||v[0]!==DATA.length){let c=0;for(let i=0;i<DATA.length;i++)if(words(i).includes(" "+t))c++;v=[DATA.length,c];dfc.set(t,v)}return v[1]};
function cands(busca,n){n=n||6;const T=[...new Set(toks(busca))];if(!T.length)return{c:[],low:false};
const W=T.map(t=>Math.log((DATA.length+1)/(df(t)+1))+.5),tot=W.reduce((a,b)=>a+b,0),need=Math.max(1,Math.ceil(T.length*.6)),strong=[],weak=[];
for(let i=0;i<DATA.length;i++){const w=words(i);let m=0,s=0;for(let k=0;k<T.length;k++)if(w.includes(" "+T[k])){m++;s+=W[k]}
if(m)(m>=need?strong:weak).push([i,s/tot])}

return{c:L.slice(0,n).map(x=>x[0]),low:!strong.length&&L.length>0}}

const armed=new WeakMap();

function mkRow(x){const R=cands(x.busca,6),mat=x.tipo==="material";

const PDFV="3.11.174",PDFB="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/"+PDFV+"/";

function pdfLines(items){let o="",y=null;for(const it of items){if(typeof it.str!=="string")continue;const yy=it.transform?Math.round(it.transform[5]):0;
